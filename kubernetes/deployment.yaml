
apiVersion: apps/v1
kind: Deployment

metadata:
  name: autoheal-deployment
  labels:
    app: autoheal

spec:
  replicas: 3

  selector:
    matchLabels:
      app: autoheal

  template:
    metadata:
      labels:
        app: autoheal

    spec:
      containers:
        - name: autoheal-container

          image: autoheal-app:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

